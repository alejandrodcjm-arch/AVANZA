name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  app:
    name: App (lint, tipos, unitarias, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://demo.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/publico.spec.ts
        env:
          CRON_SECRET: un-secreto-de-prueba-largo-123456

  base-de-datos-y-flujos:
    name: Base de datos (pgTAP) y flujos completos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0
      - name: Levantar Supabase local (migraciones + seed)
        run: supabase start -x studio,edge-runtime,logflare,vector,imgproxy,storage-api,realtime
      - name: Pruebas de permisos y lógica (pgTAP)
        run: supabase test db
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Variables de la app desde Supabase local
        run: |
          supabase status -o env > /tmp/sb.env
          source /tmp/sb.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
            echo "MAIL_URL=${MAILPIT_URL:-http://127.0.0.1:54324}"
          } >> "$GITHUB_ENV"
      - name: Build y flujos completos
        working-directory: web
        env:
          E2E_FULL: 1
          NEXT_PUBLIC_APP_URL: http://localhost:3100
          CRON_SECRET: un-secreto-de-prueba-largo-123456
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
      - name: Publicar capturas en la rama "capturas" (para revisión visual)
        if: always() && github.event_name == 'push'
        run: |
          [ -d web/capturas ] || exit 0
          cd web/capturas
          git init -q -b capturas
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Capturas de ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas
